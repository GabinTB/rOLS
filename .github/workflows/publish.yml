name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

permissions: {}

jobs:
  validate_and_prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check tag matches pyproject version
        if: github.event_name == 'workflow_run'
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["TAG_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} != pyproject version {version!r}; expected v{version}")
          print(f"{tag} matches {version}")
          PY
        env:
          TAG_NAME: ${{ github.event.workflow_run.head_branch }}
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        if: github.event_name == 'workflow_run'
        with:
          name: dist
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv build
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: validate_and_prepare
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rols
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@f7600683efdcb7656dec5b29656edb7bc586e597 # release/v1

  testpypi:
    needs: validate_and_prepare
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rols
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@f7600683efdcb7656dec5b29656edb7bc586e597 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
