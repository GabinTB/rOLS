[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rols"
version = "0.2.1"
description = "Vectorized rolling and expanding regression for multi-target, multi-factor time series."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabin Taibi", email = "gabin.taibi@icloud.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/GabinTB/rOLS"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=5.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "pandas-datareader>=0.10.0",
]

[tool.setuptools]
packages = ["rols"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["examples/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["rols"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
