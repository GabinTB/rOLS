[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rols"
version = "0.2.1"
description = "Vectorized rolling and expanding regression for multi-target, multi-factor time series."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabin Taibi", email = "gabin.taibi@icloud.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Repository = "https://github.com/GabinTB/rOLS"

[tool.setuptools]
packages = ["rols"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "pandas-datareader>=0.10.0",
]
